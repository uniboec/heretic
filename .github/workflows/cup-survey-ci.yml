name: cup-survey CI

on:
  push:
    paths:
      - 'cup-survey/**'
      - '.github/workflows/cup-survey-ci.yml'
  pull_request:
    paths:
      - 'cup-survey/**'
      - '.github/workflows/cup-survey-ci.yml'

defaults:
  run:
    working-directory: cup-survey

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cup_survey
          POSTGRES_PASSWORD: cup_survey
          POSTGRES_DB: cup_survey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cup_survey -d cup_survey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cup_survey:cup_survey@localhost:5432/cup_survey?schema=public
      ADMIN_SESSION_SECRET: ci-test-secret-min-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cup-survey/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Club separation benchmark
        run: npm run benchmark:club-separation

      - name: Production build
        run: npm run build
