name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  test-deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deploy unit tests
        run: |
          python deploy/test_release_app_switch.py
          python deploy/test_static_manifest.py
          python deploy/test_manifest_gate.py
          python deploy/test_active_slot.py

  deploy-staging:
    if: inputs.target == 'staging'
    needs: test-deploy-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          DEPLOY_HOST: ${{ secrets.CUP_SURVEY_STAGING_HOST }}
          DEPLOY_KEY: ${{ secrets.CUP_SURVEY_STAGING_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "Set CUP_SURVEY_STAGING_HOST secret for remote deploy"
            exit 0
          fi
          echo "ssh ${DEPLOY_HOST} 'cd /opt/cup-survey && git pull && ./deploy/release-app.sh'"

  deploy-production:
    if: inputs.target == 'production'
    needs: test-deploy-scripts
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.CUP_SURVEY_PROD_HOST }}
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "Set CUP_SURVEY_PROD_HOST secret for remote deploy"
            exit 0
          fi
          echo "ssh ${DEPLOY_HOST} 'cd /opt/cup-survey && ./deploy/release-app.sh'"
