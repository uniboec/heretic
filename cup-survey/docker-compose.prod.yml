services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cup_survey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cup_survey}
    volumes:
      - cup_survey_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cup_survey}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: deps
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cup_survey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cup_survey}?schema=public
    command: >
      sh -c "npx prisma migrate deploy --schema=./prisma/schema.prisma"

  app:
    image: cup-survey-app:current
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cup_survey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cup_survey}?schema=public
    ports:
      - '${APP_PORT:-3001}:3000'

volumes:
  cup_survey_pg:
