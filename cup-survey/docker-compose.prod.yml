services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cup_survey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cup_survey}
    volumes:
      - cup_survey_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cup_survey}']
      interval: 5s
      timeout: 5s
      retries: 10

  app-blue:
    image: ${CUP_BLUE_IMAGE:?CUP_BLUE_IMAGE is required}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cup_survey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cup_survey}?schema=public
      PAYMENT_PROOFS_DIR: /app/data/payment-proofs
      ANNOUNCER_CACHE_DIR: /app/data/announcer-cache
      CUP_DISABLE_LAZY_RECONCILE: ${CUP_DISABLE_LAZY_RECONCILE:-0}
    ports:
      - '${BLUE_PORT:-3001}:3000'
    volumes:
      - /opt/cup-survey-data/payment-proofs:/app/data/payment-proofs
      - /opt/cup-survey-data/announcer-cache:/app/data/announcer-cache
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  app-green:
    image: ${CUP_GREEN_IMAGE:?CUP_GREEN_IMAGE is required}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cup_survey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cup_survey}?schema=public
      PAYMENT_PROOFS_DIR: /app/data/payment-proofs
      ANNOUNCER_CACHE_DIR: /app/data/announcer-cache
      CUP_DISABLE_LAZY_RECONCILE: ${CUP_DISABLE_LAZY_RECONCILE:-0}
    ports:
      - '${GREEN_PORT:-3002}:3000'
    volumes:
      - /opt/cup-survey-data/payment-proofs:/app/data/payment-proofs
      - /opt/cup-survey-data/announcer-cache:/app/data/announcer-cache

  announcer-worker:
    image: ${CUP_BLUE_IMAGE:?CUP_BLUE_IMAGE is required}
    restart: unless-stopped
    env_file: .env
    command: ['npx', 'tsx', 'scripts/announcer-worker.ts']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cup_survey}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cup_survey}?schema=public
      ANNOUNCER_CACHE_DIR: /app/data/announcer-cache
    volumes:
      - /opt/cup-survey-data/announcer-cache:/app/data/announcer-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "announcer-worker" >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

networks:
  default:
    external: true
    name: cup-survey-prod

volumes:
  cup_survey_pg:
