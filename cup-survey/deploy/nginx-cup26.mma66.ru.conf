# cup26.mma66.ru — полный конфиг nginx на VPS 159.194.210.165
# После certbot строки ssl_* подставятся автоматически.
# Заголовки безопасности: deploy/nginx-security-headers.conf

include snippets/cup-survey-upstream.conf;

server {
    server_name cup26.mma66.ru;

    include snippets/cup-survey-security-headers.conf;

    location /_next/static/ {
        alias /opt/cup-survey-shared/_next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://cup_survey_app;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=300, stale-while-revalidate=86400" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cup26.mma66.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cup26.mma66.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = cup26.mma66.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cup26.mma66.ru;
    return 404; # managed by Certbot


}