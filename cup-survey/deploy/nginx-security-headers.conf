# Подключать в server { } для cup26.mma66.ru (после SSL от certbot).
# CSP должен совпадать с lib/securityHeaders.ts (productionContentSecurityPolicy).
proxy_hide_header X-Powered-By;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://metrica.yandex.ru https://metrica.yandex.com https://metr.yandex.ru https://webvisor.com; frame-src 'self' https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net; object-src 'none'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org https://yastatic.net wss://mc.yandex.ru wss://mc.webvisor.com wss://mc.webvisor.org" always;
